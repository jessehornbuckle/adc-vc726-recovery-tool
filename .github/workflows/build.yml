name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: ADC-VC726-Recovery-macOS
            archive: ADC-VC726-Recovery-macOS-arm64.zip
          - os: windows-latest
            artifact: ADC-VC726-Recovery-Windows
            archive: ADC-VC726-Recovery-Windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Build application
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --name ADC-VC726-Recovery
          run_app.py
      - name: Smoke-test packaged macOS app
        if: runner.os == 'macOS'
        run: |
          QT_QPA_PLATFORM=offscreen dist/ADC-VC726-Recovery.app/Contents/MacOS/ADC-VC726-Recovery &
          app_pid=$!
          sleep 3
          kill -0 "$app_pid"
          kill "$app_pid"
          wait "$app_pid" || true
      - name: Smoke-test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/ADC-VC726-Recovery/ADC-VC726-Recovery.exe" -PassThru
          Start-Sleep -Seconds 3
          if ($process.HasExited) { throw "Packaged application exited unexpectedly" }
          Stop-Process -Id $process.Id
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          dist/ADC-VC726-Recovery.app
          ADC-VC726-Recovery-macOS-arm64.zip
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          Compress-Archive
          -Path dist/ADC-VC726-Recovery
          -DestinationPath ADC-VC726-Recovery-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
