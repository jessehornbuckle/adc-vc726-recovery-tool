[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vc726-recovery"
version = "0.1.1a5"
description = "Guarded desktop recovery assistant for the Alarm.com ADC-VC726 camera"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Jesse Hornbuckle" },
]
keywords = ["adc-vc726", "alarm.com", "hikvision", "uart", "u-boot", "right-to-repair"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]
dependencies = [
  "PySide6-Essentials>=6.7,<7",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "pyinstaller>=6.11,<7",
]

[project.scripts]
vc726-recovery = "vc726_recovery.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vc726_recovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
